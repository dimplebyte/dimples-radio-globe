<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore radio stations around the world on an interactive globe."
    >

    <title>Radio Globe</title>

    <!-- MapLibre CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="app">

        <!-- =========================
             GLOBE
        ========================== -->

        <div id="globe"></div>


        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="top-bar">

            <div class="logo">
                RADIO<span>GLOBE</span>
            </div>

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search city or station..."
                    autocomplete="off"
                >

                <button
                    id="searchButton"
                    type="button"
                >
                    Search
                </button>

            </div>

        </header>


        <!-- =========================
             STATION INFORMATION
        ========================== -->

        <aside
            id="stationPanel"
            class="station-panel hidden"
        >

            <button
                id="closePanel"
                class="close-button"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

            <div class="station-icon">
                📻
            </div>

            <p
                id="stationCountry"
                class="station-country"
            >
                Country
            </p>

            <h2 id="stationName">
                Station Name
            </h2>

            <p id="stationCity">
                City
            </p>

            <button
                id="panelPlayButton"
                class="large-play-button"
                type="button"
            >
                ▶ Play
            </button>

        </aside>


        <!-- =========================
             BOTTOM PLAYER
        ========================== -->

        <footer class="player">

            <div class="now-playing">

                <span class="player-label">
                    NOW PLAYING
                </span>

                <strong id="currentStation">
                    Select a station
                </strong>

                <span id="playerStatus">
                    Ready
                </span>

            </div>


            <div class="player-controls">

                <button
                    id="previousButton"
                    class="control-button"
                    type="button"
                    aria-label="Previous station"
                >
                    ⏮
                </button>

                <button
                    id="mainPlayButton"
                    class="main-play-button"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>

                <button
                    id="nextButton"
                    class="control-button"
                    type="button"
                    aria-label="Next station"
                >
                    ⏭
                </button>

            </div>


            <div class="volume-control">

                <span>🔊</span>

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    aria-label="Volume"
                >

            </div>

        </footer>


        <!-- =========================
             LOADING SCREEN
        ========================== -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >

            <div class="loader"></div>

            <p>
                Loading Radio Globe...
            </p>

        </div>

    </div>


    <!-- =========================
         RADIO AUDIO
    ========================== -->

    <audio
        id="radioAudio"
        preload="none"
    ></audio>


    <!-- =========================
         MAPLIBRE
    ========================== -->

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>


    <!-- =========================
         THREE.JS
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


    <!-- =========================
         OUR JAVASCRIPT
    ========================== -->

    <script src="js/stations.js"></script>
    <script src="js/globe.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
